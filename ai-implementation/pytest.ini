[pytest]
testpaths = tests

# Put the project root on sys.path so `from src import config` resolves.
# Without this, bare `pytest` fails with "No module named 'src'" while
# `python -m pytest` works -- the latter adds the CWD to sys.path, the former
# doesn't. The path is relative to rootdir, so it stays correct in any clone.
pythonpath = .

# NOTE: do not add --basetemp here. It used to be pinned to a path under
# C:/Users/Madison, which broke `pytest` on every other machine (a teammate's
# clone, the Suricata VM). pytest's default temp root is correct on a healthy
# machine.
#
# If you hit `PermissionError: [WinError 5] Access is denied` on
# %LOCALAPPDATA%\Temp\pytest-of-<user>, that directory has a broken ACL on your
# machine. Either remove it (see README "If pytest fails on the temp
# directory") or override it for your shell only, without touching this file:
#
#   $env:PYTEST_ADDOPTS = "--basetemp=C:/Users/<you>/pytest-tmp"   # PowerShell
#   export PYTEST_ADDOPTS="--basetemp=$HOME/pytest-tmp"            # bash
