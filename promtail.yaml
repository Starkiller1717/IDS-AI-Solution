server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  # Replace with the IP (or hostname) of the machine running Loki on your
  # network -- this is per-person/per-lab-setup, not shared config.
  - url: http://<YOUR_LOKI_HOST_IP>:3100/loki/api/v1/push

scrape_configs:
  - job_name: suricata
    pipeline_stages:
      - json:
          expressions:
            src_ip: src_ip
            proto: proto
            event_type: event_type
            dest_port: dest_port
            alert: alert
      - json:
          source: alert
          expressions:
            action: action
            signature_id: signature_id
            signature: signature
            category: category
            severity: severity
      - labels:
          src_ip:
          proto:
          event_type:
          dest_port:
          signature_id:
          signature:
          category:
          severity:
    static_configs:
      - targets:
          - localhost
        labels:
          job: suricata_logs
          __path__: /var/log/suricata/eve.json

  - job_name: ai_incidents
    static_configs:
      - targets:
          - localhost
        labels:
          job: ai_incidents
          # Replace with the absolute path to output/incidents.jsonl on this
          # machine -- per-person/per-lab-setup, not shared config. This is
          # relative to config.PROJECT_ROOT, i.e. the inner ai-implementation/
          # folder that contains src/, data/, and models/ (where
          # `python -m src.detector.suricata_reader` is run from), not the
          # outer repo checkout.
          __path__: <PATH_TO_PROJECT_ROOT>/output/incidents.jsonl
    pipeline_stages:
      - json:
          expressions:
            classification: classification
            attack_type: attack_type
            alert_triggered: alert_triggered
            protocol: protocol
      - labels:
          classification:
          attack_type:
          alert_triggered:
          protocol:
